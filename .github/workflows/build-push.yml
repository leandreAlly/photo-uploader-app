name: Build and push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the test suite
        run: mvn -B test

      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build the image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHA="${GITHUB_SHA::7}"
          IMAGE="$REGISTRY/${{ vars.ECR_REPOSITORY }}:latest"

          docker build \
            --build-arg "VERSION=$SHA" \
            --build-arg "COMMIT=$GITHUB_SHA" \
            --build-arg "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$IMAGE" \
            .

          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Publish the deployment config
        run: |
          mkdir -p build

          sed -e "s|<TASK_FAMILY>|${{ vars.TASK_FAMILY }}|" \
              -e "s|<EXECUTION_ROLE_ARN>|${{ vars.TASK_EXEC_ROLE_ARN }}|" \
              -e "s|<TASK_ROLE_ARN>|${{ vars.TASK_ROLE_ARN }}|" \
              -e "s|<LOG_GROUP>|${{ vars.LOG_GROUP }}|" \
              -e "s|<AWS_REGION>|${{ vars.AWS_REGION }}|" \
              -e "s|<DB_URL>|${{ vars.DB_URL }}|" \
              -e "s|<DB_SECRET_ARN>|${{ vars.DB_SECRET_ARN }}|g" \
              -e "s|<IMAGE_BUCKET>|${{ vars.IMAGE_BUCKET }}|" \
              -e "s|<IMAGE_PREFIX>|${{ vars.IMAGE_PREFIX }}|" \
              -e "s|<CDN_DOMAIN>|${{ vars.CDN_DOMAIN }}|" \
              -e "s|<IMAGE>|${{ steps.image.outputs.uri }}|" \
              taskdef.json > build/taskdef.json

          jq empty build/taskdef.json

          cp appspec.yaml build/appspec.yaml
          (cd build && zip -q app.zip taskdef.json appspec.yaml)

          aws s3 cp build/app.zip "s3://${{ vars.ARTIFACT_BUCKET }}/config/app.zip"

      - name: Push the image
        run: |
          docker push "${{ steps.image.outputs.uri }}"
