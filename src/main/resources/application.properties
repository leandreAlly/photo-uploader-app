server.port=8080
server.shutdown=graceful
spring.application.name=photo-uploader-app

app.version=${APP_VERSION:local}
app.commit=${APP_COMMIT:unknown}
app.builtAt=${APP_BUILT_AT:unknown}

app.image.bucket=${APP_IMAGE_BUCKET:}
app.image.prefix=${APP_IMAGE_PREFIX:images/}
app.cdn.domain=${APP_CDN_DOMAIN:}

# SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD arrive from the task
# definition - the URL as plain configuration, the credentials from Secrets
# Manager - so nothing about the database is committed here.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
