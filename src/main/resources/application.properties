server.port=8080
server.shutdown=graceful
spring.application.name=photo-uploader-app

app.version=${APP_VERSION:local}
app.commit=${APP_COMMIT:unknown}
app.builtAt=${APP_BUILT_AT:unknown}

# SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD arrive from the task
# definition - the URL as plain configuration, the credentials from Secrets
# Manager - so nothing about the database is committed here.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
